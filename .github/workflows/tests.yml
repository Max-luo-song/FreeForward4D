name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'numpy>=1.26,<2' pillow einops
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Runtime and calibration contracts
        run: python -m unittest discover -s tests -v
      - name: Syntax and release audit
        run: |
          python -m compileall -q freeforward scripts train.py inference.py
          bash -n scripts/*.sh
          python scripts/audit_release.py
      - name: H200 launch plans
        run: |
          python scripts/launch_training.py --stage 2s --nproc-per-node 8 --dry-run
          python scripts/launch_training.py --stage 8s --nproc-per-node 8 --dry-run
